
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Heardle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Browns / Skin tones */
      --color-brown:       #be4a2f;
      --color-brown-light: #d77643;
      --color-skin-pale:   #ead4aa;
      --color-skin:        #e4a672;
      --color-skin-dark:   #b86f50;

      /* Reds */
      --color-red-dark:    #733e39;
      --color-maroon-dark: #3e2731;
      --color-red:         #a22633;
      --color-red-bright:  #e43b44;
      --color-red-vivid:   #ff0044;

      /* Oranges / Yellows */
      --color-orange:      #f77622;
      --color-amber:       #feae34;
      --color-yellow:      #fee761;

      /* Greens */
      --color-green:       #63c74d;
      --color-green-mid:   #3e8948;
      --color-green-mid:   #3e8948;
      --color-green-dark:  #265c42;
      --color-teal-dark:   #193c3e;

      /* Blues / Cyans */
      --color-blue-dark:   #124e89;
      --color-blue:        #0099db;
      --color-cyan:        #2ce8f5;

      /* Grays / Darks */
      --color-white:       #ffffff;
      --color-gray-light:  #c0cbdc;
      --color-gray:        #8b9bb4;
      --color-gray-mid:    #5a6988;
      --color-gray-dark:   #3a4466;
      --color-navy:        #262b44;
      --color-void:        #181425;
      --color-black:       #000000;

      /* Pinks / Purples */
      --color-purple-dark: #68386c;
      --color-magenta:     #b55088;
      --color-pink:        #f6757a;
      --color-peach:       #e8b796;
      --color-peach-dark:  #c28569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'VT323', monospace;
      min-height: 100vh;
      overflow-y: auto;
      background-color: var(--color-navy);
    }

    /* ━━━ MAIN PAGE ━━━ */
    #main-page {
      display: none;
      opacity: 0;
      transition: opacity 0.6s;
      width: 960px;
      margin: auto
    }
    #main-page.visible {
      padding-top: 30px;
      display: block;
      opacity: 1;
      min-height: 150vh;
    }

    /* Mossy cobblestone texture overlay */
    #main-page::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 31px,
          rgba(94,233,233,0.04) 31px,
          rgba(94,233,233,0.04) 32px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 47px,
          rgba(139,151,182,0.03) 47px,
          rgba(139,151,182,0.03) 48px
        );
    }

    .page-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 2rem 1.25rem 5rem;
      position: relative;
      z-index: 1;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 1rem 1rem 1rem;
      position: relative;
    }
    .hero-title {
      font-family: 'Jersey 10', sans-serif;
      font-size: 4rem;
      letter-spacing: 0.5rem;
      color: var(--color-white);
      text-shadow: 3px 3px 0 var(--color-gray);
      line-height: 1.8;
    }
    .hero-msg {
      font-size: 1.3rem;
      color: var(--color-white);
      max-width: 520px;
      margin: 1.2rem auto;
      line-height: 1.7;
      opacity: 0.9;
    }

    /* ── Section wrapper ── */
    .section {
      background: var(--color-gray);
      border: 4px solid var(--color-gray-dark);
      border-radius: 5px;
      padding: 1.25rem 1.25rem 1.5rem;
    }
    .section-title {
      font-family: 'Jersey 10', sans-serif;
      font-size: 0.6rem;
      color: var(--color-gray-dark);
      letter-spacing: 0.12em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      content: '';
      flex: 1;
      height: 2px;
      background: repeating-linear-gradient(90deg, var(--color-gray-dark) 0, var(--color-gray-dark) 4px, transparent 8px, transparent 10px);
    }

    /* ── Message section ── */
    .message-box {
      background: var(--color-gray-light);
      border-left: 4px solid var(--color-gray-dark);
      padding: 1rem 1.25rem;
      line-height: 1.8;
      height: 100%;
      color: var(--color-gray-dark);
      font-size: 3rem;
    }

    .choose-genre {
      font-family: 'Jersey 10', sans-serif;
      display: flex;
      justify-content: center;
      color: var(--color-gray-dark);
    }

    .genre-container {
      justify-content: center;
      gap: 5px;
      display: flex;
      flex-wrap: wrap;
    }

    .genre-selector {
      font-family: 'Jersey 10', sans-serif;
      line-height: 2.2rem;
      font-size: 2rem;
      width: 130px;
      margin: 20px;
      border: 3px solid var(--color-gray-dark);
      border-radius: 5px;
      text-align: center;
      background-color: var(--color-gray-light);
      color: var(--color-gray-dark);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .genre-selector:hover {
      background-color: var(--color-gray);
      color: var(--color-gray-white);
      transform: scale(1.05);
    }
    
    .disabled {
      opacity: 50%;
      pointer-events: none;
    }

    /* ── Footer ── */
    .page-footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 1rem;
      color: var(--stone);
      letter-spacing: 0.1em;
    }
    .page-footer a { color: var(--slate); text-decoration: none; }
    .page-footer a:hover { text-decoration: underline; }

    /* Floating pixel leaves / embers */
    .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
    .floater {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      animation: float-up var(--fd) ease-in var(--delay) infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(0) rotate(0deg) scale(0.75); opacity: 0; }
      10%  { opacity: 0.65; }
      80%  { opacity: 0.35; }
      100% { transform: translateY(-120px) rotate(25deg) scale(1.25); opacity: 0; }
    }
  
  </style>
</head>
<body>

<!-- ══════════════════════════════
     MAIN PAGE
══════════════════════════════ -->
<div id="main-page">
  <div class="floaters" id="floaters"></div>
    <div class="page-wrap">
      <header class="hero">
        <h1 class="hero-title">🎵 Heardle, but better! 🎵</h1>
        <p class="hero-msg">
          Justin Holderby<br>
        </p>
      </header>

      <!-- Personal message -->
      <section class="section" aria-labelledby="msg-title">
        <div class="section-title" id="msg-title"></div>
        <div class="message-box">
          <div class="choose-genre">Choose a genre:</div>
          <div class="genre-container">
            <a href="heardleGenre.html?genre=disney" class="genre-selector disabled">Disney</a>
            <a href="heardleGenre.html?genre=movies" class="genre-selector">Movies</a>
            <!-- <a href="heardleGenre.html?genre=2010s" class="genre-selector disabled">2010s</a>
            <a href="heardleGenre.html?genre=2000s" class="genre-selector disabled">2000s</a>
            <a href="heardleGenre.html?genre=1980s" class="genre-selector disabled">1980s</a>
            <a href="heardleGenre.html?genre=television" class="genre-selector disabled">TV Themes</a>
            <a href="heardleGenre.html?genre=glee" class="genre-selector disabled">Glee</a>
            <a href="heardleGenre.html?genre=games" class="genre-selector disabled">Games</a>
            <a href="heardleGenre.html?genre=kpop" class="genre-selector">K-Pop</a>
            <a href="heardleGenre.html?genre=christmas" class="genre-selector">Christmas</a> -->
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>

const mp = document.getElementById('main-page');
mp.style.display = 'block';
requestAnimationFrame(() => mp.classList.add('visible'));
initFloaters();

/* ── FLOATING LEAVES / EMBERS ── */
function initFloaters() {
  const container = document.getElementById('floaters');
  container.innerHTML = '';
  /* autumn-toned symbols */
  const symbols = ['♬','🎵','🎶','♩','♬'];
  const colors  = ['#ff0044','#0099db','#68386c'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = symbols[i % symbols.length];
    el.style.cssText = `left:${Math.random()*100}%;bottom:${-20+Math.random()*30}px;color:${colors[i%colors.length]};--fd:${4+Math.random()*6}s;--delay:${Math.random()*8}s`;
    container.appendChild(el);
  }
}

</script>
</body>
</html>
